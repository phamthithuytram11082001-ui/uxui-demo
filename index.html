<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuraTech - Flagship E-Commerce & Merchant Cash Flow Hub</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --brand: #4f46e5;
            --brand-hover: #4338ca;
            --brand-light: #eef2ff;
            --surface: #ffffff;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #475569;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 6px 16px -2px rgba(15,23,42,0.08);
            --shadow-lg: 0 16px 32px -4px rgba(15,23,42,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 60px; /* Space for mobile bottom bar */
        }

        /* Top Header */
        header {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 18px;
            color: var(--text-heading);
            letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--brand);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Desktop Flow Switcher */
        .stage-nav {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            gap: 2px;
        }

        .stage-btn {
            border: none;
            background: transparent;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-body);
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .stage-btn.active {
            background: var(--surface);
            color: var(--brand);
            box-shadow: var(--shadow-sm);
        }

        .stage-btn.seller-pill {
            color: #047857;
            background: #d1fae5;
        }

        .stage-btn.seller-pill.active {
            background: #10b981;
            color: white;
        }

        .cart-trigger-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-heading);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .cart-badge {
            background: var(--brand);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
        }

        /* Mobile Bottom App Navigation */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            border-top: 1px solid var(--border);
            padding: 6px 12px;
            z-index: 1000;
            justify-content: space-around;
        }

        .mob-nav-item {
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .mob-nav-item.active {
            color: var(--brand);
        }

        /* Container */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            padding: 0 18px;
            flex: 1;
        }

        .screen {
            display: none;
            animation: fadeIn 0.25s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero */
        .hero-banner {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%);
            color: white;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .hero-banner p { font-size: 13.5px; color: #c7d2fe; max-width: 560px; line-height: 1.5; }

        /* Category Chips */
        .filter-scroller {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
